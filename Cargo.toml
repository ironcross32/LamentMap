[package]
name = "lament-mapper"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Accessible explorer for Lament wilderness maps captured by Mudlet"
license = "MIT"
default-run = "LamentMapper"

[lib]
name = "lament_mapper"
path = "src/lib.rs"

[[bin]]
name = "LamentMapper"
path = "src/main.rs"

[[bin]]
name = "pack-sounds"
path = "src/bin/pack_sounds.rs"

[dependencies]
chacha20poly1305 = "0.10.1"
crossbeam-channel = "0.5.15"
flexi_logger = { version = "=0.31.10", default-features = false }
hex = "0.4.3"
libloading = "0.8.8"
log = "0.4.28"
rand = "0.9.2"
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "vorbis"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"
toml = "0.9.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
wxdragon = "=0.9.18"

[dev-dependencies]
tempfile = "3.21.0"

[build-dependencies]
embed-manifest = "=1.5.0"

[profile.release]
lto = "thin"
strip = true
