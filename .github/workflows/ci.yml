name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  rust-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0-x86_64-pc-windows-msvc --profile minimal --component rustfmt,clippy
          rustup default 1.95.0-x86_64-pc-windows-msvc
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Bootstrap Prism 0.17.3
        shell: pwsh
        run: ./scripts/bootstrap-prism.ps1
      - name: Release build
        run: cargo build --release --bin LamentMapper --bin pack-sounds
      - name: Verify runtime exclusions
        shell: pwsh
        run: if (Test-Path config.toml) { throw "config.toml must not be committed or generated by CI" }

  mudlet-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Muddler 1.1.0 source
        uses: actions/checkout@v4
        with:
          repository: demonnic/muddler
          ref: 97125cd7806fe7fdce84533eb4b683fe2503b94d
          path: .ci/muddler
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build pinned Muddler
        run: |
          chmod +x .ci/muddler/gradlew
          .ci/muddler/gradlew -p .ci/muddler shadowJar --no-daemon
      - name: Validate package JSON
        shell: pwsh
        run: |
          Get-ChildItem accessible_lament_map/src -Recurse -Filter *.json | ForEach-Object {
            Get-Content -Raw $_.FullName | ConvertFrom-Json | Out-Null
          }
      - name: Build Mudlet package
        working-directory: accessible_lament_map
        run: java -jar ../.ci/muddler/build/libs/muddle-1.1.0-all.jar
      - name: Verify expected package and embedded handlers
        shell: pwsh
        run: |
          $package = "accessible_lament_map/build/Accessible Lament Map.mpackage"
          $xmlPath = "accessible_lament_map/build/Accessible Lament Map.xml"
          if (-not (Test-Path -LiteralPath $package -PathType Leaf)) { throw "Expected package was not produced: $package" }
          if (-not (Test-Path -LiteralPath $xmlPath -PathType Leaf)) { throw "Expected package XML was not produced: $xmlPath" }

          [xml]$xml = Get-Content -Raw -LiteralPath $xmlPath
          $required = @(
            @{ XPath = "//Script[name='LamentMapper']/script"; Marker = "lamentMapper.initialize()" },
            @{ XPath = "//Alias[name='LamentMapper setup']/script"; Marker = "lamentMapper.setup()" },
            @{ XPath = "//Alias[name='LamentMapper status']/script"; Marker = "lamentMapper.status()" },
            @{ XPath = "//Trigger[name='LamentMapper prompt boundary']/script"; Marker = "lamentMapper.onPrompt()" }
          )
          foreach ($item in $required) {
            $node = $xml.SelectSingleNode($item.XPath)
            if ($null -eq $node -or -not $node.InnerText.Contains($item.Marker)) {
              throw "Required Mudlet handler is missing or empty: $($item.XPath)"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: accessible-lament-map
          path: accessible_lament_map/build/Accessible Lament Map.mpackage
          if-no-files-found: error
          retention-days: 7
